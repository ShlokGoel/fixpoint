name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: python scripts/demo_toy.py --scripted

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker build -f examples/Dockerfile.toy -t fixpoint-toy examples/
      - run: FIXPOINT_TEST_IMAGE=fixpoint-toy pytest tests/test_docker_sandbox.py
      - run: python scripts/demo_toy.py --scripted --docker fixpoint-toy
